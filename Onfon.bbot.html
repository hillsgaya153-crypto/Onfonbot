
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Onfon Loan Assist — WhatsApp Bot Prototype</title>
<link rel="stylesheet" href="Style.css">
</head>
<body>
<div class="wrap">
  <div class="viewtoggle">
    <button id="tabCustomer" class="active">Chats</button>
    <button id="tabIT">IT Dashboard</button>
  </div>

  <div class="frame" id="customerFrame">

    <div class="header">
      <svg class="hicon back" viewBox="0 0 24 24"><path d="M15.5 19L8.5 12L15.5 5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <img src="image/mitchelle.png" alt="Onfon Mobile" class="avatar" style="width: 40px; height: 40px; border-radius: 50%; margin-right: 10px;">
      <div class="info">
        <div class="name">Mish_.onfon</div>
        <div class="status online" id="statusline">online</div>
      </div>
      <div class="hicons-right">
        <svg class="hicon" viewBox="0 0 24 24"><path d="M17 10.5V7a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-3.5l4 4v-11l-4 4z" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linejoin="round"/></svg>
        <svg class="hicon" viewBox="0 0 24 24"><path d="M6.6 10.8a13 13 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 9 9 0 0 0 2.8.45 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A16 16 0 0 1 3 5a1 1 0 0 1 1-1h3.6a1 1 0 0 1 1 1 9 9 0 0 0 .45 2.8 1 1 0 0 1-.25 1L6.6 10.8z" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linejoin="round"/></svg>
      </div>
    </div>
    <div class="chat" id="chat"></div>
    <div class="inputbar">
      <svg class="hicon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.4" fill="none"/><circle cx="9" cy="10" r="1" fill="currentColor"/><circle cx="15" cy="10" r="1" fill="currentColor"/><path d="M8 14.5q4 3 8 0" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round"/></svg>
      <input id="textInput" type="text" placeholder="Write message here....." autocomplete="off">
      <svg class="hicon" viewBox="0 0 24 24"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z" stroke="currentColor" stroke-width="1.4" fill="none"/><path d="M6 11a6 6 0 0 0 12 0M12 17v3" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round"/></svg>
      <button class="sendbtn" id="sendBtn">&#10148;</button>
    </div>
  </div>

  <div class="dashboard" id="itFrame">
    <h2>Device Release Queue</h2>
    <div class="sub">Auto-generated when a customer with a cleared balance requests release</div>
    <div id="queueList"></div>
  </div>
</div>

<script src="BOTT.JS"></script>
</body>
</html>
